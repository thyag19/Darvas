# Scheduled refresh, INERT until the repository variable IRIE_REFRESH_ENABLED is set to 'true'.
# Runs only when the market could be open or the daily check is due, which keeps the run count low (about 8 a day):
#   hourly ticks 03:50-09:50 UTC Mon-Fri = 09:20-15:20 IST, and one daily tick 13:35 UTC = 19:05 IST.
# `irie run-cycle` still decides what is permitted: it consults the Asia/Kolkata calendar (holidays, exceptional sessions, a year
# missing from the calendar fails closed), fetches only cleared sources, logs every skip, and never requests prices outside a session.
# Then it builds a PUBLIC-mode site, runs the pre-publication gate (`check-site`), and keeps the result as a build artifact.
# It deploys nothing and holds no credentials; state lives in a best-effort cache; for real operation run this in a PRIVATE repository
# or on a machine you control, because the inbox and the database contain data this public repository must never hold.
# GitHub may delay scheduled runs and disables scheduled workflows after 60 days without repository activity.
name: scheduled-refresh
on:
  schedule:
    - cron: "50 3-9 * * 1-5"
    - cron: "35 13 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.IRIE_REFRESH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: irie.sqlite
          key: irie-db-${{ github.run_id }}
          restore-keys: irie-db-
      - run: python -m irie.cli run-cycle --db irie.sqlite --registry config/sources.json --calendar config/market_calendar.json --inbox inbox
      - run: python -m irie.cli build-site --db irie.sqlite --registry config/sources.json --calendar config/market_calendar.json --out dist --mode public
      - run: python -m irie.cli check-site --dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
